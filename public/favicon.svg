<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Pixel Art Poké Ball 32x32 -->
  <rect width="32" height="32" fill="none"/>
  
  <!-- Outer Black Border (Pixelated Circle) -->
  <path d="
    M11,2 h10 v2 h-10 z
    M7,4 h4 v2 h-4 z M21,4 h4 v2 h-4 z
    M5,6 h2 v2 h-2 z M25,6 h2 v2 h-2 z
    M3,8 h2 v3 h-2 z M27,8 h2 v3 h-2 z
    M2,11 h1 v10 h-1 z M29,11 h1 v10 h-1 z
    M3,21 h2 v3 h-2 z M27,21 h2 v3 h-2 z
    M5,24 h2 v2 h-2 z M25,24 h2 v2 h-2 z
    M7,26 h4 v2 h-4 z M21,26 h4 v2 h-4 z
    M11,28 h10 v2 h-10 z
  " fill="#111827"/>

  <!-- Top Half: Red Fill -->
  <path d="
    M11,4 h10 v2 h-10 z
    M7,6 h18 v2 h-18 z
    M5,8 h22 v3 h-22 z
    M3,11 h26 v3 h-26 z
    M3,14 h26 v1 h-26 z
  " fill="#ef4444"/>

  <!-- Top Highlight (Pixel Shine) -->
  <path d="
    M12,5 h5 v1 h-5 z
    M9,7 h5 v1 h-5 z
    M7,9 h3 v2 h-3 z
  " fill="#fca5a5"/>

  <!-- Center Black Dividing Line -->
  <rect x="2" y="14" width="28" height="4" fill="#111827"/>

  <!-- Bottom Half: White Fill -->
  <path d="
    M3,17 h26 v1 h-26 z
    M3,18 h26 v3 h-26 z
    M5,21 h22 v3 h-22 z
    M7,24 h18 v2 h-18 z
    M11,26 h10 v2 h-10 z
  " fill="#f8fafc"/>

  <!-- Bottom Shadow -->
  <path d="
    M11,25 h10 v2 h-10 z
    M7,23 h18 v1 h-18 z
  " fill="#cbd5e1"/>

  <!-- Center Button Outer Ring -->
  <path d="
    M13,12 h6 v1 h-6 z
    M12,13 h8 v6 h-8 z
    M13,19 h6 v1 h-6 z
  " fill="#111827"/>

  <!-- Center Button Grey Rim -->
  <rect x="13" y="13" width="6" height="6" fill="#e2e8f0"/>

  <!-- Center Button Inner White Core -->
  <rect x="14" y="14" width="4" height="4" fill="#ffffff"/>
</svg>
